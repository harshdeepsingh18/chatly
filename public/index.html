<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3b3fd8">
  <meta name="description" content="Chatly is a friendly place to catch up with your people in real time.">
  <title>Chatly</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- LOGIN SCREEN -->
  <section id="login" class="screen">
    <div id="login-card" class="login-card">
      <div class="brand-lockup">
        <img src="/logo.svg" alt="" class="brand-logo">
        <div>
          <h1>Chatly</h1>
          <p>Good conversations start here.</p>
        </div>
      </div>
      <p class="welcome-copy">Welcome. Sign in to join your people and catch up in real time.</p>
      <div id="google-signin">
        <button id="google-fallback" type="button">Continue with Google</button>
      </div>
      <p id="auth-status" role="status"></p>
    </div>
  </section>

  <!-- USERNAME SCREEN -->
  <section id="username-screen" class="screen hidden">
    <form id="username-form" class="login-card">
      <h1>Choose your username</h1>
      <p>Your name must be unique. Other people in the chat will see it.</p>
      <input id="username" type="text" maxlength="20" placeholder="Username" autocomplete="nickname" required>
      <button id="username-submit" type="submit">Continue to chat</button>
      <p id="username-status" role="status"></p>
    </form>
  </section>

  <!-- CHAT SCREEN -->
  <section id="chat" class="screen hidden">
    <aside id="sidebar">
      <h2>Rooms</h2>
      <nav id="room-list" aria-label="Chat rooms">
        <button type="button" class="room-button active" data-room="general"># general</button>
        <button type="button" class="room-button" data-room="doubts"># doubts</button>
        <button type="button" class="room-button" data-room="notes"># notes</button>
      </nav>
      <h2>Online <span id="online-count">0</span></h2>
      <ul id="user-list"></ul>
    </aside>

    <main>
      <header>
        <button id="menu-btn" aria-label="Show online users">☰</button>
        <div class="title">
          <strong><img src="/logo.svg" alt="" class="header-logo"> Chatly</strong>
          <small id="me"></small>
        </div>
        <div id="call-controls" class="hidden" aria-label="Call options">
          <button id="voice-call-btn" type="button" aria-label="Start voice call" title="Voice call">Call</button>
          <button id="video-call-btn" type="button" aria-label="Start video call" title="Video call">Video</button>
        </div>
        <input id="search-input" type="search" placeholder="Search messages" aria-label="Search messages">
        <button id="saved-btn" type="button" aria-pressed="false">☆ Saved</button>
        <button id="theme-btn" aria-label="Switch light or dark mode">🌙</button>
      </header>

      <div id="conversation-title"># general</div>
      <div id="pinned-messages" class="hidden" aria-label="Pinned messages"></div>
      <div id="messages" aria-live="polite"></div>
      <div id="typing"></div>

      <form id="message-form">
        <div id="emoji-panel" class="hidden"></div>
        <button type="button" id="emoji-btn" aria-label="Add emoji">😊</button>
        <button type="button" id="file-btn" aria-label="Attach a file">+</button>
        <input id="file-input" type="file" class="hidden" accept="image/*,.pdf,.txt,.docx">
        <input id="message-input" type="text" placeholder="Message or @aura ask a question" autocomplete="off">
        <button type="submit" id="send-btn" aria-label="Send">Send</button>
      </form>
    </main>
  </section>

  <section id="call-modal" class="call-modal hidden" role="dialog" aria-modal="true" aria-labelledby="call-status">
    <div class="call-card">
      <p id="call-status">Calling…</p>
      <div class="call-videos">
        <video id="remote-video" autoplay playsinline></video>
        <video id="local-video" autoplay muted playsinline></video>
      </div>
      <div id="incoming-call-actions" class="call-actions hidden">
        <button id="accept-call-btn" type="button">Accept</button>
        <button id="decline-call-btn" type="button">Decline</button>
      </div>
      <div id="active-call-actions" class="call-actions hidden">
        <button id="mute-call-btn" type="button">Mute</button>
        <button id="camera-call-btn" type="button">Camera off</button>
        <button id="hangup-call-btn" type="button">Hang up</button>
      </div>
    </div>
  </section>

  <script src="/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
</body>
</html>
